name: "Node CI helper"
description: "Sets up Node, caches npm, installs dependencies"
inputs:
  node-version:
    description: "Node.js version"
    required: true
  working-directory:
    description: "Where package.json / lockfile lives"
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
    - run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
